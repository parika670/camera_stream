<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head><meta charset="utf-8"><title>پنل مدیریت</title></head>
<body style="font-family:sans-serif;padding:20px">
  <h2>پنل تماشا</h2>
  <div id="videos"></div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    const peers = {};

    socket.on('user-offer', async ({ id, sdp }) => {
      const pc = new RTCPeerConnection({ iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] });
      peers[id] = pc;

      pc.ontrack = (event) => {
        const video = document.createElement('video');
        video.srcObject = event.streams[0];
        video.autoplay = true; video.playsInline = true;
        video.style.width = '320px'; video.style.margin = '5px';
        video.dataset.id = id;
        document.getElementById('videos').appendChild(video);
      };

      pc.onicecandidate = e => {
        if (e.candidate) socket.emit('admin-ice', { to: id, candidate: e.candidate });
      };

      await pc.setRemoteDescription(new RTCSessionDescription(sdp));
      const answer = await pc.createAnswer();
      await pc.setLocalDescription(answer);
      socket.emit('admin-answer', { to: id, sdp: answer });
    });

    socket.on('user-ice', async ({ id, candidate }) => {
      const pc = peers[id];
      if (pc) await pc.addIceCandidate(new RTCIceCandidate(candidate));
    });

    socket.on('user-disconnected', (id) => {
      const v = document.querySelector(`video[data-id="${id}"]`);
      if (v) v.remove();
      delete peers[id];
    });
  </script>
</body>
</html>
